<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Лаборатория кликов</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topline"></header>
      <div class="grid">
        <section class="panel">
          <h2>Одинарный клик</h2>
          <p class="muted">Каждое нажатие добавляет один балл.</p>
          <div class="score stat">0</div> 
          <button class="score-button btn primary">Добавить балл</button> 
        </section>
        <section class="panel">
          <h2>Двойной клик</h2>
          <p class="muted">Дважды нажмите на карточку.</p>
          <button class="double-card tile" type="button"> 
            Двойной щелчок меняет меня
          </button>
        </section>
        <section class="panel wide">
          <h2>Наведение мыши</h2>
          <div class="hover-zone">Наведите сюда курсор</div>
          <p class="status" aria-live="polite"> 
            Ожидание действия.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
